[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+space"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
last_pane = "prefix+l"
new_workspace = ""
new_tab = "prefix+t"
toggle_sidebar = "prefix+p"

[ui]
pane_gaps = false
prompt_new_tab_name = false

[terminal]
new_cwd = "follow"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = '''workspace="$("$HERDR_BIN_PATH" workspace list | jq -r '.result.workspaces[] | [.workspace_id, .label] | @tsv' | fzf --with-nth=2.. --prompt='workspace> ')" && [ -n "$workspace" ] && "$HERDR_BIN_PATH" workspace focus "$(printf '%s' "$workspace" | cut -f1)"'''
description = "fuzzy workspace picker"
width = "60%"
height = "60%"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"

[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = '"$HERDR_BIN_PATH" workspace create --cwd "$HOME" --focus'
description = "new workspace"
